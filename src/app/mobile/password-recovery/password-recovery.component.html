<form [formGroup]="passwordRecoveryForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="recoverypassword">{{
      "mobile.password-recovery.field-label" | translate
    }}</label>
    <input
      id="recoverypassword"
      [readonly]="printPasswordSent"
      toUppercase
      maxlength="16"
      formControlName="value"
      (focusin)="window.scrollTo(0, window.document.body.scrollHeight - 80)"
    />
    <span
      class="field-error"
      *ngIf="
        passwordRecoveryForm.controls.value.touched &&
        passwordRecoveryForm.controls.value.hasError('invalidFiscalCode')
      "
    >
      {{ "mobile.password-recovery.field-error" | translate }}
    </span>
  </div>

  <div class="d-flex flex-column">
    <h4 class="text-center mb-3" *ngIf="printPasswordSent">
      {{ "mobile.password-recovery.success-message" | translate }}
    </h4>
    <div class="d-flex align-items-center w-100">
      <app-mobile-button
        *ngIf="!printPasswordSent"
        class="w-100"
        [disabled]="!passwordRecoveryForm.valid"
        type="submit"
      >
        {{ "send" | translate | toUpperCase }}
      </app-mobile-button>
      <app-mobile-button
        class="w-100 ms-2"
        *ngIf="!fromApp"
        type="button"
        [outlined]="true"
        routerLink=".."
      >
        {{ "back" | translate | toUpperCase }}
      </app-mobile-button>
    </div>
  </div>
</form>
