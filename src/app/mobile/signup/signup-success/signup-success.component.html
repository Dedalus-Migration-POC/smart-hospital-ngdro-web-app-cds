<div class="d-flex flex-column h-100 container">
  <div class="d-flex flex-column align-items-center">
    <img
      class="icon_popup_success"
      alt=""
      [src]="deployUrl + 'assets/images/icon_popup_success.svg'"
    />
    <span class="title">{{ "mobile.signup-success.title" | translate }}</span>
    <span>{{ "mobile.signup-success.text" | translate }}</span>
  </div>
  <div class="d-flex justify-content-end mt-5">
    <app-mobile-button class="w-100" type="button" (click)="onContinue()">
      {{ "continue" | translate | toUpperCase }}
    </app-mobile-button>
  </div>
</div>
