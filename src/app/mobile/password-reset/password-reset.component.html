<ng-container
  *ngIf="key === null || key === undefined || key === ''; else keyPresent"
>
  <div>KEY NOT RECOGNIZED</div>
</ng-container>

<ng-template #keyPresent>
  <form [formGroup]="passwordRestoreForm" (ngSubmit)="onSubmit()">
    <div class="d-flex flex-column">
      <div class="form-group">
        <label for="password1">{{
          "mobile.password-reset.password1" | translate
        }}</label>
        <input
          id="password1"
          formControlName="password1"
          [type]="password1hidden ? 'password' : 'text'"
          (keyup.enter)="focusNext()"
          (keyup.tab)="focusNext()"
          autocomplete="new-password"
        />
        <span
          class="field-error"
          *ngIf="
            passwordRestoreForm.controls.password1.touched &&
            passwordRestoreForm.controls.password1.hasError(
              'invalidPassword'
            ) &&
            !passwordRestoreForm.controls.password1.hasError('required')
          "
          [innerHTML]="'mobile.commons.password-criteria' | translate"
        >
        </span>
      </div>

      <div class="form-group">
        <label for="password2">{{
          "mobile.password-reset.password2" | translate
        }}</label>
        <input
          id="password2"
          formControlName="password2"
          [type]="password2hidden ? 'password' : 'text'"
          autocomplete="new-password"
          (keyup.enter)="closeKeyboard()"
          (focusin)="window.scrollTo(0, window.document.body.scrollHeight - 80)"
        />
        <span
          class="field-error"
          *ngIf="
            passwordRestoreForm.controls.password2.hasError('matching') &&
            !passwordRestoreForm.controls.password2.hasError('required')
          "
        >
          {{ "mobile.password-reset.not-match-error" | translate }}
        </span>
        <span class="field-error" *ngIf="error">{{
          "mobile.password-reset.reset-error" | translate
        }}</span>
      </div>
    </div>

    <div class="mt-5">
      <app-mobile-button
        class="w-100"
        [disabled]="!passwordRestoreForm.valid"
        type="submit"
      >
        {{ (error ? "retry" : "send") | translate | toUpperCase }}
      </app-mobile-button>
    </div>
  </form>
</ng-template>
