<div class="report container d-flex flex-column h-100">
  <div class="row gt-0 my-3">
    <div class="col-12">
      <button type="button" class="btn btn-link text-decoration-none px-2 fw-semibold fs-sm" (click)="goBack()">
        <fa-icon [icon]="['fas', 'arrow-left']"></fa-icon>
        {{ 'report.back' | translate }}
      </button>
    </div>
  </div>

  <div class="row gt-0 mb-3">
    <div class="col-12" [class.col-md-6]="reportDocument?.mimeType === 'application/dicon'">
      <div class="h-100 d-flex flex-column px-2">
        <h2>{{ reportDocument?.name }}</h2>
        <h6 class="fw-normal"> {{ 'report.releaseDate' | translate: { date: releaseDateObj?.date, time: releaseDateObj?.time } }}</h6>
      </div>
    </div>

    <div *ngIf="reportDocument?.mimeType === 'application/dicon'" class="col-12 col-md-6">
      <div class="d-flex align-items-center justify-content-end">
        <button type="button" class="btn btn-primary" (click)="getPdfDocument(reportDocument?.documentId!)">
          <img src="assets/images/file.svg" class="me-2" alt="pdf">
          <span>{{ 'report.openReport' | translate }}</span>
        </button>
      </div>
    </div>
  </div>

  <ng-container [ngSwitch]="view.current">
    <ng-container *ngSwitchCase="ViewMode.IMAGE">
      <ng-container *ngIf="!isLoading">
        <app-frame [urls]="getValues(reportDocument?.additionalInfo!)"></app-frame>
      </ng-container>
    </ng-container>

    <ng-container *ngSwitchCase="ViewMode.PDF_SINGLE">
      <ng-container *ngIf="!isLoading">
        <app-pdf-viewer [pdfBase64]="pdfDocument?.body?.content"
                        [mimeType]="pdfDocument?.body?.mimeType"
                        [fileName]="pdfDocument?.header?.title"></app-pdf-viewer>
      </ng-container>
    </ng-container>

    <ng-container *ngSwitchCase="ViewMode.PDF_MULTI">
      <app-list-pdf [list]="reportDocument?.relatedDocuments!" (showPdf)="showPdf($event)" [ngClass]="{'pe-none': isLoading }"></app-list-pdf>

      <ng-container *ngIf="!isLoading">
        <app-pdf-viewer [pdfBase64]="pdfDocument?.body?.content"
                        [mimeType]="pdfDocument?.body?.mimeType"
                        [fileName]="pdfDocument?.header?.title"></app-pdf-viewer>
      </ng-container>
    </ng-container>
  </ng-container>

  <ng-container *ngIf="isLoading">
     <app-load-spinner class="h-100 d-flex justify-content-center align-items-center my-5" [showLabel]="true" [styleClass]="'text-yellow'"></app-load-spinner>
  </ng-container>
</div>
