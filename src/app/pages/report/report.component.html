<div class="container h-100 d-flex flex-column" *ngIf="report">
  <div class="row g-0 py-3">
    <div class="col-12">
      <button type="button" class="btn btn-link text-decoration-none px-2 py-0 fw-semibold fs-sm" (click)="goBack()">
        <fa-icon [icon]="['fas', 'arrow-left']"></fa-icon>
        {{ 'goBack' | translate }}
      </button>
    </div>
  </div>

  <div class="row g-0 mb-3">
    <div class="col-12">
      <h2 class="px-2 mb-0">{{ report.name }}</h2>
      <h6 *ngIf="!hasDicom" class="px-2 fw-normal"> {{ 'report.releaseDate' | translate: { date: releaseDate?.date, time: releaseDate?.time } }}</h6>
    </div>
  </div>

  <ng-container *ngIf="hasDicom; else onlyPdf">
    <app-card [report]="report" (showReport)="showReport($event)" [ngClass]="{'pe-none': loadingReport}"></app-card>

    <ng-container *ngIf="loadingReport; else viewReport">
        <ng-container *ngTemplateOutlet="loading"></ng-container>
    </ng-container>

    <ng-template #viewReport>
      <ng-container *ngIf="selectedReport?.mimeType === MimeTypeEnum.DICOM && dicom">
        <app-frame [dicom]="dicom"></app-frame>
      </ng-container>
      <ng-container *ngIf="selectedReport?.mimeType === MimeTypeEnum.PDF && pdf">
        <app-pdf-viewer [pdf]="pdf"></app-pdf-viewer>
      </ng-container>
    </ng-template>
  </ng-container>

  <ng-template #onlyPdf>
    <ng-container *ngIf="pdf; else loading">
      <app-pdf-viewer [pdf]="pdf"></app-pdf-viewer>
    </ng-container>
  </ng-template>


  <ng-template #loading>
    <app-load-spinner class="flex-grow-1 d-flex justify-content-center align-items-center py-3"
                      [showLabel]="true"
                      styleClass="text-yellow"></app-load-spinner>
  </ng-template>
</div>
