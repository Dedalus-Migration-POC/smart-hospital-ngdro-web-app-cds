<div class="container h-100 d-flex flex-column" *ngIf="report">
  <div class="row g-0 py-3">
    <div class="col-12">
      <button type="button" class="btn btn-link text-decoration-none px-2 py-0 fw-semibold fs-sm" (click)="goBack()">
        <fa-icon [icon]="['fas', 'arrow-left']"></fa-icon>
        {{ 'goBack' | translate }}
      </button>
    </div>
  </div>

  <div class="row g-0 mb-3">
    <div class="col-12">
      <h2 class="px-2 mb-0">{{ report.name }}</h2>
      <h6 *ngIf="!hasDicom" class="px-2 fw-normal mt-2"> {{ 'report.releaseDate' | translate: { date: releaseDate?.date, time: releaseDate?.time } }}</h6>
    </div>
  </div>

  <div *ngIf="hasDicom; else onlyPdf" class="position-relative h-100 d-flex flex-column">
    <app-card [report]="report" (showReport)="showReport($event)"></app-card>

    <ng-container *ngIf="loadingReport; else viewReport">
        <ng-container *ngTemplateOutlet="loading"></ng-container>
    </ng-container>

    <ng-template #viewReport>
      <ng-container *ngIf="selectedReport?.mimeType === MimeTypeEnum.DICOM && dicom">
        <app-frame [dicom]="dicom"></app-frame>
      </ng-container>
      <ng-container *ngIf="selectedReport?.mimeType === MimeTypeEnum.PDF && pdf">
        <app-pdf-viewer [pdf]="pdf"></app-pdf-viewer>
      </ng-container>
    </ng-template>
  </div>

  <ng-template #onlyPdf>
    <ng-container *ngIf="pdf; else loading">
      <app-pdf-viewer [pdf]="pdf"></app-pdf-viewer>
    </ng-container>
  </ng-template>


  <ng-template #loading>
    <div class="flex-grow-1 d-flex justify-content-center align-items-center">
      <div class="position-absolute top-0 h-100 w-100 pe-0 z-3"></div>
      <app-load-spinner class="py-3"
                        [showLabel]="true"
                        styleClass="text-yellow"></app-load-spinner>
    </div>

  </ng-template>

  <ng-template #errorDicom>
    <label>{{ 'report.externalDicomError' | translate }}</label>
  </ng-template>
</div>
