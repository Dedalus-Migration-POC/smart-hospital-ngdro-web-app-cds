<div class="faq mt-n5 mb-5 w-100 bg-yellow d-flex align-items-center justify-content-center">
  <label class="mb-0 fw-semibold fs-4">{{ 'home.faq' | translate }}</label>
</div>

<div class="container">
  <div class="row justify-content-center" *ngFor="let faqData of faqList; let i = index">
    <div class="col-12 col-md-12 col-lg-8">
      <div [id]="'accordion-' + i" class="accordion mb-5">
        <div class="accordion">
          <div class="accordion-item border-0" *ngFor="let faq of faqData.children; let j = index">
            <label class="accordion-header">
              <button class="accordion-button collapsed border-top" type="button"
                      data-bs-toggle="collapse"
                      [attr.data-bs-target]="'#panel-' + i + '_' + j"
                      [attr.aria-expanded]="false"
                      [attr.aria-controls]="'panel-' + i + '_' + j"
                      [attr.data-bs-parent]="'#accordion-' + i">
                {{ faq.title }}
              </button>
            </label>
            <div [id]="'panel-' + i + '_' + j" class="accordion-collapse collapse" [attr.data-bs-parent]="'#accordion-' + i ">
              <div class="accordion-body">
                <span [innerHTML]="sanitizeHtml(faq.content)"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
